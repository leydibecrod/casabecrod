<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Barrio Dinamarca - Exportar</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #111; }
    #map { width: 3840px; height: 2160px; }

    .lot-label {
      background: none;
      border: none;
      font-weight: bold;
      font-size: 16px;
      color: #fff;
      text-shadow: 1px 1px 4px rgba(0,0,0,0.9), -1px -1px 4px rgba(0,0,0,0.9), 2px 2px 6px rgba(0,0,0,0.7);
      white-space: nowrap;
      pointer-events: none;
    }

    .distance-label {
      background: rgba(33,150,243,0.9);
      color: white;
      padding: 3px 8px;
      border-radius: 4px;
      font-size: 14px;
      font-weight: bold;
      border: none;
      white-space: nowrap;
    }

    .measurement-label {
      background: rgba(255,87,34,0.9);
      color: white;
      padding: 4px 10px;
      border-radius: 5px;
      font-size: 15px;
      font-weight: bold;
      border: none;
      white-space: nowrap;
    }

    .mz-label {
      background: rgba(0,0,0,0.7);
      color: #FFD600;
      padding: 4px 10px;
      border-radius: 5px;
      font-size: 18px;
      font-weight: bold;
      border: 1px solid #FFD600;
      white-space: nowrap;
    }

    .vertex-label {
      background: none;
      border: none;
      font-weight: bold;
      font-size: 13px;
      color: #fff;
      text-shadow: 1px 1px 3px rgba(0,0,0,0.9), -1px -1px 3px rgba(0,0,0,0.9);
    }

    .title-label {
      background: rgba(0,0,0,0.85);
      color: #fff;
      padding: 12px 24px;
      border-radius: 8px;
      font-size: 22px;
      font-weight: bold;
      border: 2px solid #FFD600;
      white-space: nowrap;
      text-align: center;
      line-height: 1.4;
    }

    .legend-panel {
      position: absolute;
      bottom: 20px;
      left: 20px;
      z-index: 1000;
      background: rgba(0,0,0,0.85);
      color: #fff;
      padding: 16px 20px;
      border-radius: 10px;
      border: 2px solid #FFD600;
      font-size: 14px;
      line-height: 1.6;
    }
    .legend-panel h3 { color: #FFD600; margin-bottom: 8px; font-size: 18px; }
    .legend-row { display: flex; align-items: center; gap: 8px; margin-bottom: 4px; }
    .legend-swatch { width: 16px; height: 16px; border-radius: 3px; border: 1px solid rgba(255,255,255,0.3); flex-shrink: 0; }
  </style>
</head>
<body>
  <div id="map"></div>

  <div class="legend-panel" id="legendPanel">
    <h3>BARRIO DINAMARCA - Solares SUNARP</h3>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    function utmToLatLng(easting, northing, zone, southern) {
      const a = 6378137, f = 1 / 298.257223563, k0 = 0.9996;
      const e = Math.sqrt(2 * f - f * f), e2 = e * e / (1 - e * e);
      const x = easting - 500000, y = southern ? northing - 10000000 : northing;
      const M = y / k0;
      const mu = M / (a * (1 - e * e / 4 - 3 * Math.pow(e, 4) / 64 - 5 * Math.pow(e, 6) / 256));
      const e1 = (1 - Math.sqrt(1 - e * e)) / (1 + Math.sqrt(1 - e * e));
      const phi1 = mu + (3 * e1 / 2 - 27 * Math.pow(e1, 3) / 32) * Math.sin(2 * mu)
        + (21 * e1 * e1 / 16 - 55 * Math.pow(e1, 4) / 32) * Math.sin(4 * mu)
        + (151 * Math.pow(e1, 3) / 96) * Math.sin(6 * mu)
        + (1097 * Math.pow(e1, 4) / 512) * Math.sin(8 * mu);
      const sinPhi = Math.sin(phi1), cosPhi = Math.cos(phi1), tanPhi = Math.tan(phi1);
      const N1 = a / Math.sqrt(1 - e * e * sinPhi * sinPhi);
      const T1 = tanPhi * tanPhi, C1 = e2 * cosPhi * cosPhi;
      const R1 = a * (1 - e * e) / Math.pow(1 - e * e * sinPhi * sinPhi, 1.5);
      const D = x / (N1 * k0);
      const lat = phi1 - (N1 * tanPhi / R1) * (D * D / 2
        - (5 + 3 * T1 + 10 * C1 - 4 * C1 * C1 - 9 * e2) * Math.pow(D, 4) / 24
        + (61 + 90 * T1 + 298 * C1 + 45 * T1 * T1 - 252 * e2 - 3 * C1 * C1) * Math.pow(D, 6) / 720);
      const lng0 = ((zone - 1) * 6 - 180 + 3) * Math.PI / 180;
      const lng = lng0 + (D - (1 + 2 * T1 + C1) * Math.pow(D, 3) / 6
        + (5 - 2 * C1 + 28 * T1 - 3 * C1 * C1 + 8 * e2 + 24 * T1 * T1) * Math.pow(D, 5) / 120) / cosPhi;
      return { lat: lat * 180 / Math.PI, lng: lng * 180 / Math.PI };
    }

    const map = L.map('map', { zoomControl: false, attributionControl: false });

    const satellite = L.tileLayer(
      'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',
      { maxNativeZoom: 19, maxZoom: 23 }
    ).addTo(map);

    const solares = [
      { name: 'Mz32 - Sr. Valerio', color: '#4CAF50', vertices: [
        { east: 215590.311, north: 9367198.3636 }, { east: 215579.725, north: 9367172.3284 },
        { east: 215563.0456, north: 9367179.3414 }, { east: 215573.037, north: 9367205.374 }],
        sides: [28.11, 18.09, 27.88, 18.64] },
      { name: 'Mz32 - Sr. Onorato', color: '#2196F3', vertices: [
        { east: 215647.7892, north: 9367175.5857 }, { east: 215637.2033, north: 9367149.5505 },
        { east: 215615.1635, north: 9367158.6069 }, { east: 215625.4522, north: 9367184.6407 }],
        sides: [28.11, 23.83, 27.99, 24.10] },
      { name: 'Mz33 - Alsides Briones', color: '#9C27B0', vertices: [
        { east: 215682.1595, north: 9367267.8781 }, { east: 215692.151, north: 9367293.9106 },
        { east: 215707.0415, north: 9367288.0708 }, { east: 215697.05, north: 9367262.0383 }],
        sides: [27.88, 15.99, 27.88, 15.99] },
      { name: 'Mz33 - Pablo Hinostroza', color: '#FF9800', vertices: [
        { east: 215665.0622, north: 9367218.7053 }, { east: 215675.1277, north: 9367244.812 },
        { east: 215688.2308, north: 9367239.7763 }, { east: 215678.1653, north: 9367213.6696 }],
        sides: [27.98, 14.04, 27.98, 14.04] },
      { name: 'Mz35 - Casa Brijido', color: '#00BCD4', vertices: [
        { east: 215691.9285, north: 9367210.6303 }, { east: 215701.9199, north: 9367236.6628 },
        { east: 215715.6186, north: 9367231.4083 }, { east: 215705.6271, north: 9367205.3758 }],
        sides: [27.88, 14.67, 27.88, 14.67] },
      { name: 'Mz35 - Casa Comunal', color: '#E91E63', vertices: [
        { east: 215705.7758, north: 9367205.3764 }, { east: 215715.6173, north: 9367231.7036 },
        { east: 215729.7619, north: 9367226.4511 }, { east: 215719.9204, north: 9367200.1239 }],
        sides: [28.11, 15.09, 28.11, 15.09] },
      { name: 'Mz32 - Sr. Onorato (2)', color: '#1565C0', vertices: [
        { east: 215628.6798, north: 9367127.659 }, { east: 215618.0938, north: 9367101.6239 },
        { east: 215603.7979, north: 9367107.4663 }, { east: 215613.1948, north: 9367133.4962 }],
        sides: [28.11, 15.44, 27.67, 16.55] },
      { name: 'Mz36 - Yovani Cayao', color: '#FF6F00', vertices: [
        { east: 215680.2483, north: 9367163.3274 }, { east: 215670.2569, north: 9367137.295 },
        { east: 215655.9636, north: 9367142.5468 }, { east: 215665.9551, north: 9367168.5793 }],
        sides: [27.88, 15.23, 27.88, 15.23] },
      { name: 'Mz36 - Sara Togas', color: '#D84315', vertices: [
        { east: 215655.9636, north: 9367142.5468 }, { east: 215683.9582, north: 9367131.4498 },
        { east: 215679.8464, north: 9367120.2095 }, { east: 215651.8518, north: 9367131.3064 }],
        sides: [30.11, 11.97, 30.11, 11.97] },
      { name: 'Mz30 - Jesus Becerra', color: '#388E3C', vertices: [
        { east: 215532.0887, north: 9367188.0625 }, { east: 215542.0775, north: 9367214.6857 },
        { east: 215556.968, north: 9367208.8459 }, { east: 215546.9766, north: 9367182.8134 }],
        sides: [28.44, 15.99, 27.88, 15.79] },
      { name: 'Mz29 - Abulio Arce', color: '#7B1FA2', vertices: [
        { east: 215574.5831, north: 9367258.5379 }, { east: 215559.6927, north: 9367264.3777 },
        { east: 215570.2787, north: 9367290.413 }, { east: 215585.1718, north: 9367283.9825 }],
        sides: [15.99, 28.11, 16.22, 27.56] },
      { name: 'Mz33 - Opuesta Alcides', color: '#AB47BC', vertices: [
        { east: 215622.0031, north: 9367291.2347 }, { east: 215631.9946, north: 9367317.2673 },
        { east: 215646.885, north: 9367311.4275 }, { east: 215636.8936, north: 9367285.3949 }],
        sides: [27.88, 15.99, 27.88, 15.99] },
      { name: 'Mz33 - Frente Abilio', color: '#5C6BC0', vertices: [
        { east: 215603.4921, north: 9367242.4247 }, { east: 215613.4828, north: 9367268.6049 },
        { east: 215625.6925, north: 9367263.9344 }, { east: 215615.5531, north: 9367237.7535 }],
        sides: [28.02, 13.07, 28.08, 12.93] },
      { name: 'Mz30 - Karen', color: '#26A69A', vertices: [
        { east: 215513.2792, north: 9367139.5465 }, { east: 215523.268, north: 9367166.1697 },
        { east: 215538.1584, north: 9367160.3299 }, { east: 215528.1671, north: 9367134.2974 }],
        sides: [28.44, 15.99, 27.88, 15.79] },
      { name: 'Mz32 - Moises Marin', color: '#795548', vertices: [
        { east: 215554.2275, north: 9367156.8579 }, { east: 215569.1179, north: 9367151.0181 },
        { east: 215558.532, north: 9367124.983 }, { east: 215543.6415, north: 9367130.8227 }],
        sides: [15.99, 28.11, 15.99, 28.11] },
    ];

    // Compute bounds from all solares
    let allEasts = [], allNorths = [];
    solares.forEach(s => s.vertices.forEach(v => { allEasts.push(v.east); allNorths.push(v.north); }));
    const minE = Math.min(...allEasts) - 30, maxE = Math.max(...allEasts) + 30;
    const minN = Math.min(...allNorths) - 30, maxN = Math.max(...allNorths) + 30;
    const sw = utmToLatLng(minE, minN, 18, true);
    const ne = utmToLatLng(maxE, maxN, 18, true);
    map.fitBounds([[sw.lat, sw.lng], [ne.lat, ne.lng]]);

    const legendPanel = document.getElementById('legendPanel');

    solares.forEach(solar => {
      const coords = solar.vertices.map(v => {
        const ll = utmToLatLng(v.east, v.north, 18, true);
        return [ll.lat, ll.lng];
      });

      let solarArea = 0;
      for (let i = 0; i < solar.vertices.length; i++) {
        const j = (i + 1) % solar.vertices.length;
        solarArea += solar.vertices[i].east * solar.vertices[j].north;
        solarArea -= solar.vertices[j].east * solar.vertices[i].north;
      }
      solarArea = Math.abs(solarArea) / 2;
      const solarPerimeter = solar.sides.reduce((s, d) => s + d, 0);

      L.polygon(coords, { color: solar.color, weight: 3, fillColor: solar.color, fillOpacity: 0.35 }).addTo(map);

      const centerLat = coords.reduce((s, c) => s + c[0], 0) / coords.length;
      const centerLng = coords.reduce((s, c) => s + c[1], 0) / coords.length;
      L.marker([centerLat, centerLng], {
        icon: L.divIcon({
          className: 'lot-label',
          html: solar.name.split(' - ')[1] || solar.name,
          iconSize: [120, 20],
          iconAnchor: [60, 10]
        })
      }).addTo(map);

      // Vertex labels
      coords.forEach((c, i) => {
        L.circleMarker(c, { radius: 5, color: solar.color, fillColor: '#fff', fillOpacity: 1, weight: 2 }).addTo(map);
        L.marker(c, {
          icon: L.divIcon({
            className: 'vertex-label',
            html: `V${i + 1}`,
            iconSize: [20, 14],
            iconAnchor: [-4, 7]
          })
        }).addTo(map);
      });

      // Side distances
      for (let i = 0; i < coords.length; i++) {
        const next = coords[(i + 1) % coords.length];
        const midLat = (coords[i][0] + next[0]) / 2;
        const midLng = (coords[i][1] + next[1]) / 2;
        L.marker([midLat, midLng], {
          icon: L.divIcon({
            className: 'distance-label',
            html: `${solar.sides[i]}m`,
            iconSize: [60, 18],
            iconAnchor: [30, 9]
          })
        }).addTo(map);
      }

      // Legend
      const row = document.createElement('div');
      row.className = 'legend-row';
      row.innerHTML = `<span class="legend-swatch" style="background:${solar.color}"></span>${solar.name} (${solarArea.toFixed(0)} m²)`;
      legendPanel.appendChild(row);
    });

    // Mz32 perimeter
    const mz32Corners = [
      { east: 215573.037, north: 9367205.374 },
      { east: 215647.7892, north: 9367175.5857 },
      { east: 215618.0938, north: 9367101.6239 },
      { east: 215543.6415, north: 9367130.8227 },
    ];
    const mz32LL = mz32Corners.map(c => utmToLatLng(c.east, c.north, 18, true));
    L.polygon(mz32LL.map(c => [c.lat, c.lng]),
      { color: '#FFFFFF', weight: 3, fillColor: 'transparent', fillOpacity: 0, dashArray: '10, 6', opacity: 0.9 }
    ).addTo(map);

    // Mz32 center label
    const mz32Center = {
      lat: mz32LL.reduce((s, c) => s + c.lat, 0) / 4,
      lng: mz32LL.reduce((s, c) => s + c.lng, 0) / 4
    };
    L.marker([mz32Center.lat, mz32Center.lng], {
      icon: L.divIcon({ className: 'mz-label', html: 'Mz 32', iconSize: [70, 28], iconAnchor: [35, 14] })
    }).addTo(map);

    // Mz33 perimeter
    const mz33Corners = [
      { east: 215678.1653, north: 9367213.6696 },
      { east: 215707.0415, north: 9367288.0708 },
      { east: 215631.9946, north: 9367317.2673 },
      { east: 215603.4921, north: 9367242.4247 },
    ];
    const mz33LL = mz33Corners.map(c => utmToLatLng(c.east, c.north, 18, true));
    L.polygon(mz33LL.map(c => [c.lat, c.lng]),
      { color: '#FFEB3B', weight: 3, fillColor: 'transparent', fillOpacity: 0, dashArray: '10, 6', opacity: 0.9 }
    ).addTo(map);

    const mz33Center = {
      lat: mz33LL.reduce((s, c) => s + c.lat, 0) / 4,
      lng: mz33LL.reduce((s, c) => s + c.lng, 0) / 4
    };
    L.marker([mz33Center.lat, mz33Center.lng], {
      icon: L.divIcon({ className: 'mz-label', html: 'Mz 33', iconSize: [70, 28], iconAnchor: [35, 14] })
    }).addTo(map);

    // Mz labels for other blocks (approximate centers)
    const mzLabels = [
      { name: 'Mz 29', east: 215572, north: 9367274 },
      { name: 'Mz 30', east: 215535, north: 9367170 },
      { name: 'Mz 35', east: 215710, north: 9367218 },
      { name: 'Mz 36', east: 215668, north: 9367140 },
    ];
    mzLabels.forEach(mz => {
      const ll = utmToLatLng(mz.east, mz.north, 18, true);
      L.marker([ll.lat, ll.lng], {
        icon: L.divIcon({ className: 'mz-label', html: mz.name, iconSize: [70, 28], iconAnchor: [35, 14] })
      }).addTo(map);
    });

    // Alignment lines
    const pabloRef = { east: 215678.1653, north: 9367213.6696 };
    const alcidesRef = { east: 215697.05, north: 9367262.0383 };
    const lineDx = alcidesRef.east - pabloRef.east;
    const lineDy = alcidesRef.north - pabloRef.north;
    const lineLen = Math.sqrt(lineDx * lineDx + lineDy * lineDy);
    const extFactor = 80 / lineLen;

    const extA = { east: pabloRef.east - lineDx * extFactor, north: pabloRef.north - lineDy * extFactor };
    const extB = { east: alcidesRef.east + lineDx * extFactor, north: alcidesRef.north + lineDy * extFactor };
    const extALL = utmToLatLng(extA.east, extA.north, 18, true);
    const extBLL = utmToLatLng(extB.east, extB.north, 18, true);
    L.polyline([[extALL.lat, extALL.lng], [extBLL.lat, extBLL.lng]],
      { color: '#FFD600', weight: 3, dashArray: '10, 6', opacity: 0.9 }).addTo(map);

    const brijidoV1 = { east: 215691.9285, north: 9367210.6303 };
    const brijidoV2 = { east: 215701.9199, north: 9367236.6628 };
    const ext2A = { east: brijidoV1.east - lineDx * extFactor, north: brijidoV1.north - lineDy * extFactor };
    const ext2B = { east: brijidoV2.east + lineDx * extFactor, north: brijidoV2.north + lineDy * extFactor };
    const ext2ALL = utmToLatLng(ext2A.east, ext2A.north, 18, true);
    const ext2BLL = utmToLatLng(ext2B.east, ext2B.north, 18, true);
    L.polyline([[ext2ALL.lat, ext2ALL.lng], [ext2BLL.lat, ext2BLL.lng]],
      { color: '#FFD600', weight: 3, dashArray: '10, 6', opacity: 0.9 }).addTo(map);

    // Street width
    const refA = alcidesRef.north - pabloRef.north;
    const refB = -(alcidesRef.east - pabloRef.east);
    const refC = (alcidesRef.east - pabloRef.east) * pabloRef.north - (alcidesRef.north - pabloRef.north) * pabloRef.east;
    const refNorm = Math.sqrt(refA * refA + refB * refB);
    const streetW = Math.abs((refA * brijidoV1.east + refB * brijidoV1.north + refC) / refNorm);

    const pabloLL = utmToLatLng(pabloRef.east, pabloRef.north, 18, true);
    const brijLL = utmToLatLng(brijidoV1.east, brijidoV1.north, 18, true);
    L.polyline([[pabloLL.lat, pabloLL.lng], [brijLL.lat, brijLL.lng]],
      { color: '#4CAF50', weight: 3, opacity: 0.9 }).addTo(map);
    const stMid = { lat: (pabloLL.lat + brijLL.lat) / 2, lng: (pabloLL.lng + brijLL.lng) / 2 };
    L.marker([stMid.lat, stMid.lng], {
      icon: L.divIcon({
        className: 'measurement-label',
        html: `Jr. Moyobamba: ${streetW.toFixed(1)}m`,
        iconSize: [170, 24],
        iconAnchor: [85, -5]
      })
    }).addTo(map);

    // Onorato alignment deviations
    const onoV1 = { east: 215647.7892, north: 9367175.5857 };
    const onoV2 = { east: 215637.2033, north: 9367149.5505 };
    const distOnoV1 = (refA * onoV1.east + refB * onoV1.north + refC) / refNorm;
    const distOnoV2 = (refA * onoV2.east + refB * onoV2.north + refC) / refNorm;
    const t1 = -(refA * onoV1.east + refB * onoV1.north + refC) / (refA * refA + refB * refB);
    const projV1 = { east: onoV1.east + refA * t1, north: onoV1.north + refB * t1 };
    const t2 = -(refA * onoV2.east + refB * onoV2.north + refC) / (refA * refA + refB * refB);
    const projV2 = { east: onoV2.east + refA * t2, north: onoV2.north + refB * t2 };

    const onoV1LL = utmToLatLng(onoV1.east, onoV1.north, 18, true);
    const projV1LL = utmToLatLng(projV1.east, projV1.north, 18, true);
    const onoV2LL = utmToLatLng(onoV2.east, onoV2.north, 18, true);
    const projV2LL = utmToLatLng(projV2.east, projV2.north, 18, true);

    L.polyline([[onoV1LL.lat, onoV1LL.lng], [projV1LL.lat, projV1LL.lng]],
      { color: '#F44336', weight: 3, opacity: 0.9 }).addTo(map);
    L.polyline([[onoV2LL.lat, onoV2LL.lng], [projV2LL.lat, projV2LL.lng]],
      { color: '#F44336', weight: 3, opacity: 0.9 }).addTo(map);

    const midV1 = { lat: (onoV1LL.lat + projV1LL.lat) / 2, lng: (onoV1LL.lng + projV1LL.lng) / 2 };
    L.marker([midV1.lat, midV1.lng], {
      icon: L.divIcon({ className: 'measurement-label', html: `${Math.abs(distOnoV1).toFixed(2)}m`, iconSize: [80, 22], iconAnchor: [40, 11] })
    }).addTo(map);
    const midV2 = { lat: (onoV2LL.lat + projV2LL.lat) / 2, lng: (onoV2LL.lng + projV2LL.lng) / 2 };
    L.marker([midV2.lat, midV2.lng], {
      icon: L.divIcon({ className: 'measurement-label', html: `${Math.abs(distOnoV2).toFixed(2)}m`, iconSize: [80, 22], iconAnchor: [40, 11] })
    }).addTo(map);

    [projV1LL, projV2LL].forEach(p => {
      L.circleMarker([p.lat, p.lng], { radius: 6, color: '#4CAF50', fillColor: '#4CAF50', fillOpacity: 1, weight: 0 }).addTo(map);
    });

    // Cross street line
    const yovV4 = { east: 215665.9551, north: 9367168.5793 };
    const yovV4LL = utmToLatLng(yovV4.east, yovV4.north, 18, true);
    const distPY = Math.sqrt(Math.pow(yovV4.east - projV1.east, 2) + Math.pow(yovV4.north - projV1.north, 2));
    L.polyline([[projV1LL.lat, projV1LL.lng], [yovV4LL.lat, yovV4LL.lng]],
      { color: '#4CAF50', weight: 3, opacity: 0.9 }).addTo(map);
    const midPY = { lat: (projV1LL.lat + yovV4LL.lat) / 2, lng: (projV1LL.lng + yovV4LL.lng) / 2 };
    L.marker([midPY.lat, midPY.lng], {
      icon: L.divIcon({ className: 'measurement-label', html: `${distPY.toFixed(2)}m`, iconSize: [80, 22], iconAnchor: [40, -5] })
    }).addTo(map);

    // Title
    const titlePos = utmToLatLng(maxE - 10, maxN - 5, 18, true);
    L.marker([titlePos.lat, titlePos.lng], {
      icon: L.divIcon({
        className: 'title-label',
        html: 'ZONIFICACION AGUAS CLARAS<br>Barrio Dinamarca - Datos SUNARP',
        iconSize: [450, 60],
        iconAnchor: [450, 0]
      })
    }).addTo(map);

    // Signal when tiles loaded
    let tilesReady = false;
    satellite.on('load', () => { tilesReady = true; window._mapReady = true; });
    setTimeout(() => { window._mapReady = true; }, 8000);
  </script>
</body>
</html>
