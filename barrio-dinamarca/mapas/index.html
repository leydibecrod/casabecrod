<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">

  <title>Zonificación Aguas Claras</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: system-ui, sans-serif; }
    #map { width: 100%; height: 100vh; }

    .info-panel {
      position: absolute;
      top: 10px;
      right: 10px;
      z-index: 1000;
      background: white;
      padding: 16px;
      border-radius: 8px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.2);
      max-width: 320px;
      max-height: 90vh;
      overflow-y: auto;
      font-size: 13px;
    }
    .info-panel h3 { margin-bottom: 8px; font-size: 15px; }
    .info-panel p { margin-bottom: 6px; color: #555; }

    .measure-btn {
      position: absolute;
      top: 10px;
      left: 60px;
      z-index: 1000;
      background: white;
      border: 2px solid rgba(0,0,0,0.2);
      border-radius: 4px;
      padding: 8px 14px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 600;
    }
    .measure-btn:hover { background: #f0f0f0; }
    .measure-btn.active { background: #2196F3; color: white; }

    .clear-btn {
      position: absolute;
      top: 10px;
      left: 220px;
      z-index: 1000;
      background: white;
      border: 2px solid rgba(0,0,0,0.2);
      border-radius: 4px;
      padding: 8px 14px;
      cursor: pointer;
      font-size: 14px;
    }

    .vertex-label {
      background: none;
      border: none;
      font-weight: bold;
      font-size: 12px;
      color: #d32f2f;
      text-shadow: 1px 1px 2px white, -1px -1px 2px white, 1px -1px 2px white, -1px 1px 2px white;
    }

    .distance-label {
      background: rgba(33,150,243,0.9);
      color: white;
      padding: 2px 6px;
      border-radius: 3px;
      font-size: 11px;
      font-weight: bold;
      border: none;
      white-space: nowrap;
    }

    .measurement-label {
      background: rgba(255,87,34,0.9);
      color: white;
      padding: 3px 8px;
      border-radius: 4px;
      font-size: 12px;
      font-weight: bold;
      border: none;
      white-space: nowrap;
    }

    .street-label {
      background: rgba(0,0,0,0.7);
      color: #FFD600;
      padding: 3px 10px;
      border-radius: 4px;
      font-size: 13px;
      font-weight: bold;
      font-style: italic;
      border: 1px solid #FFD600;
      white-space: nowrap;
      text-align: center;
      letter-spacing: 1px;
    }

    .street-label-av {
      color: #FF9800;
      border-color: #FF9800;
      font-size: 12px;
    }

    .lot-label {
      background: none;
      border: none;
      font-weight: bold;
      font-size: 11px;
      color: #fff;
      text-shadow: 1px 1px 3px rgba(0,0,0,0.8), -1px -1px 3px rgba(0,0,0,0.8);

      margin-top: 12px;
      padding-top: 8px;
      border-top: 1px solid #ddd;
    }

      gap: 6px;

      border-radius: 3px;

    th, td { padding: 4px 6px; text-align: left; border-bottom: 1px solid #eee; }

    // UTM Zone 18S to Lat/Lng conversion (WGS84)
    function utmToLatLng(easting, northing, zone, southern) {
      const a = 6378137;
      const f = 1 / 298.257223563;
      const k0 = 0.9996;
      const e = Math.sqrt(2 * f - f * f);
      const e2 = e * e / (1 - e * e);
      const n = (a - a * (1 - f)) / (a + a * (1 - f));

      const x = easting - 500000;
      const y = southern ? northing - 10000000 : northing;

      const M = y / k0;
      const mu = M / (a * (1 - e * e / 4 - 3 * Math.pow(e, 4) / 64 - 5 * Math.pow(e, 6) / 256));

      const e1 = (1 - Math.sqrt(1 - e * e)) / (1 + Math.sqrt(1 - e * e));
      const phi1 = mu
        + (3 * e1 / 2 - 27 * Math.pow(e1, 3) / 32) * Math.sin(2 * mu)
        + (21 * e1 * e1 / 16 - 55 * Math.pow(e1, 4) / 32) * Math.sin(4 * mu)
        + (151 * Math.pow(e1, 3) / 96) * Math.sin(6 * mu)
        + (1097 * Math.pow(e1, 4) / 512) * Math.sin(8 * mu);

      const sinPhi = Math.sin(phi1);
      const cosPhi = Math.cos(phi1);
      const tanPhi = Math.tan(phi1);

      const N1 = a / Math.sqrt(1 - e * e * sinPhi * sinPhi);
      const T1 = tanPhi * tanPhi;
      const C1 = e2 * cosPhi * cosPhi;
      const R1 = a * (1 - e * e) / Math.pow(1 - e * e * sinPhi * sinPhi, 1.5);
      const D = x / (N1 * k0);

      const lat = phi1
        - (N1 * tanPhi / R1) * (
          D * D / 2
          - (5 + 3 * T1 + 10 * C1 - 4 * C1 * C1 - 9 * e2) * Math.pow(D, 4) / 24
          + (61 + 90 * T1 + 298 * C1 + 45 * T1 * T1 - 252 * e2 - 3 * C1 * C1) * Math.pow(D, 6) / 720
        );

      const lng0 = ((zone - 1) * 6 - 180 + 3) * Math.PI / 180;
      const lng = lng0 + (
        D
        - (1 + 2 * T1 + C1) * Math.pow(D, 3) / 6
        + (5 - 2 * C1 + 28 * T1 - 3 * C1 * C1 + 8 * e2 + 24 * T1 * T1) * Math.pow(D, 5) / 120
      ) / cosPhi;

      return { lat: lat * 180 / Math.PI, lng: lng * 180 / Math.PI };
    }

    // Satellite + labels layer (hybrid)

    const labels = L.tileLayer(
      'https://server.arcgisonline.com/ArcGIS/rest/services/Reference/World_Boundaries_and_Places/MapServer/tile/{z}/{y}/{x}',
      { maxNativeZoom: 19, maxZoom: 23 }
    );
    const streets = L.tileLayer(
      'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
      { attribution: '&copy; OpenStreetMap', maxNativeZoom: 19, maxZoom: 23 }
    );

    const hybridGroup = L.layerGroup([satellite, labels]);
    hybridGroup.addTo(map);

    L.control.layers({
      'Satelite': hybridGroup,
      'Calles': streets
    }).addTo(map);

    // Draw polygon
    const polygonCoords = latLngVertices.map(v => [v.lat, v.lng]);
    const polygon = L.polygon(polygonCoords, {
      color: '#FF5722',
      weight: 3,
      fillColor: '#FF5722',
      fillOpacity: 0.15,
      dashArray: '5, 5'
    }).addTo(map);

    // Fit map to polygon
    map.fitBounds(polygon.getBounds().pad(0.1));

    // Add vertex markers
    latLngVertices.forEach((v, i) => {
      const marker = L.circleMarker([v.lat, v.lng], {
        radius: 6,
        color: '#d32f2f',
        fillColor: '#fff',
        fillOpacity: 1,
        weight: 2
      }).addTo(map);

      // Vertex number label
      L.marker([v.lat, v.lng], {
        icon: L.divIcon({
          className: 'vertex-label',
          html: `V${v.id}`,
          iconSize: [20, 14],
          iconAnchor: [-6, 7]
        })
      }).addTo(map);

      marker.bindPopup(`
        <b>Vertice ${v.id}</b><br>
        Este: ${v.east.toFixed(3)}<br>
        Norte: ${v.north.toFixed(3)}<br>
        Lat: ${v.lat.toFixed(6)}<br>
        Lng: ${v.lng.toFixed(6)}<br>
        Dist al siguiente: ${v.dist} m
      `);
    });

    // Add side distance labels
    latLngVertices.forEach((v, i) => {
      const next = latLngVertices[(i + 1) % latLngVertices.length];
      const midLat = (v.lat + next.lat) / 2;
      const midLng = (v.lng + next.lng) / 2;

      L.marker([midLat, midLng], {
        icon: L.divIcon({
          className: 'distance-label',
          html: `${v.dist} m`,
          iconSize: [60, 16],
          iconAnchor: [30, 8]
        })
      }).addTo(map);
    });

    // Calculate area using Shoelace formula on UTM coords (meters)
    let area = 0;
    for (let i = 0; i < vertices.length; i++) {
      const j = (i + 1) % vertices.length;
      area += vertices[i].east * vertices[j].north;
      area -= vertices[j].east * vertices[i].north;
    }
    area = Math.abs(area) / 2;

    const perimeter = vertices.reduce((sum, v) => sum + v.dist, 0);

    document.getElementById('areaInfo').textContent = `Area: ${(area / 10000).toFixed(2)} ha (${area.toFixed(0)} m²)`;
    document.getElementById('perimeterInfo').textContent = `Perimetro: ${perimeter.toFixed(2)} m`;

    // Populate table
    const tbody = document.querySelector('#vertexTable tbody');
    vertices.forEach(v => {
      const tr = document.createElement('tr');
      tr.innerHTML = `<td>${v.id}</td><td>${v.east.toFixed(1)}</td><td>${v.north.toFixed(1)}</td><td>${v.dist} m</td>`;
      tbody.appendChild(tr);
    });
    const totalTr = document.createElement('tr');
    totalTr.className = 'total-row';
    totalTr.innerHTML = `<td colspan="3">Total perimetro</td><td>${perimeter.toFixed(2)} m</td>`;

    // --- Mz33 perimeter reference line ---
    // Line intersection helper
    function lineIntersection(p1, p2, p3, p4) {
      const x1 = p1.east, y1 = p1.north, x2 = p2.east, y2 = p2.north;
      const x3 = p3.east, y3 = p3.north, x4 = p4.east, y4 = p4.north;
      const denom = (x1 - x2) * (y3 - y4) - (y1 - y2) * (x3 - x4);
      if (Math.abs(denom) < 1e-10) return null;
      const t = ((x1 - x3) * (y3 - y4) - (y1 - y3) * (x3 - x4)) / denom;
      return { east: x1 + t * (x2 - x1), north: y1 + t * (y2 - y1) };
    }

    // --- Alignment analysis: Onorato vs Pablo/Alcides ---

    const pabloRef = { east: 215678.1653, north: 9367213.6696 };   // Pablo V4 (SE corner)

    const onoratoV2 = { east: 215637.2033, north: 9367149.5505 };

    // Line equation: a*x + b*y + c = 0
    const refA = alcidesRef.north - pabloRef.north;
    const refB = -(alcidesRef.east - pabloRef.east);
    const refC = (alcidesRef.east - pabloRef.east) * pabloRef.north - (alcidesRef.north - pabloRef.north) * pabloRef.east;
    const refNorm = Math.sqrt(refA * refA + refB * refB);

    const hildebranV2 = { east: 215618.0938, north: 9367101.6239 };

    const alcidesV3Ref = { east: 215707.0415, north: 9367288.0708 };

    const ext2B = { east: brijidoV1.east + lineUx * tAlcV3E, north: brijidoV1.north + lineUy * tAlcV3E };
    const ext2ALL = utmToLatLng(ext2A.east, ext2A.north, 18, true);

    // Draw street width indicator (green line between the two yellow lines)
    const brijV1LL = utmToLatLng(brijidoV1.east, brijidoV1.north, 18, true);
    const pabloV4LL = utmToLatLng(pabloRef.east, pabloRef.north, 18, true);
    L.polyline(
      [[pabloV4LL.lat, pabloV4LL.lng], [brijV1LL.lat, brijV1LL.lng]],
      { color: '#4CAF50', weight: 3, opacity: 0.9 }
    ).addTo(map);

    // Street width label
    const streetMid = {
      lat: (pabloV4LL.lat + brijV1LL.lat) / 2,
      lng: (pabloV4LL.lng + brijV1LL.lng) / 2
    };
    L.marker([streetMid.lat, streetMid.lng], {
      icon: L.divIcon({
        className: 'measurement-label',
        html: `Jr. Moyobamba: ${((streetWidthSouth + streetWidthNorth) / 2).toFixed(1)} m`,
        iconSize: [140, 20],
        iconAnchor: [70, -5]
      })
    }).addTo(map);

    // --- Line between Punto ideal V1 and Yovani V4 (cross street width) ---
    const yovaniV4 = { east: 215665.9551, north: 9367168.5793 };
    const yovaniV4LL = utmToLatLng(yovaniV4.east, yovaniV4.north, 18, true);
    const distProjYovani = Math.sqrt(
      Math.pow(yovaniV4.east - projV1.east, 2) + Math.pow(yovaniV4.north - projV1.north, 2)
    );

    L.polyline(
      [[projV1LL.lat, projV1LL.lng], [yovaniV4LL.lat, yovaniV4LL.lng]],
      { color: '#4CAF50', weight: 3, opacity: 0.9 }
    ).addTo(map);

    const midProjYov = {
      lat: (projV1LL.lat + yovaniV4LL.lat) / 2,
      lng: (projV1LL.lng + yovaniV4LL.lng) / 2
    };
    L.marker([midProjYov.lat, midProjYov.lng], {
      icon: L.divIcon({
        className: 'measurement-label',
        html: `${distProjYovani.toFixed(2)} m`,
        iconSize: [70, 20],
        iconAnchor: [35, -5]
      })
    }).addTo(map);


    // --- Alignment analysis 2: Calle perpendicular (entre Mz30/Mz32 y Mz33) ---
    // Reference line: Valerio SC V4 -> Moises Marin V4 (lado oeste Mz32, borde este de la calle)
    const valerioV4 = { east: 215573.037, north: 9367205.374 };
    const moisesV4 = { east: 215543.6415, north: 9367130.8227 };
    const conflV1 = { east: 215588.0044, north: 9367248.8524 };
    const conflV4 = { east: 215600.2134, north: 9367244.3296 };

    // Line equation for Valerio SC V4 -> Moises V4
    const ref2A = moisesV4.north - valerioV4.north;
    const ref2B = -(moisesV4.east - valerioV4.east);
    const ref2C = (moisesV4.east - valerioV4.east) * valerioV4.north - (moisesV4.north - valerioV4.north) * valerioV4.east;
    const ref2Norm = Math.sqrt(ref2A * ref2A + ref2B * ref2B);

    // Perpendicular distances
    const distConflV1 = (ref2A * conflV1.east + ref2B * conflV1.north + ref2C) / ref2Norm;
    const distConflV4 = (ref2A * conflV4.east + ref2B * conflV4.north + ref2C) / ref2Norm;

    // Street width: Jesus V3 and Sra. Yola (Karen) V4 to Valerio-Moises line
    const jesusV3 = { east: 215556.968, north: 9367208.8459 };
    const karenV4Pt = { east: 215528.1671, north: 9367134.2974 };
    const streetW2North = Math.abs((ref2A * jesusV3.east + ref2B * jesusV3.north + ref2C) / ref2Norm);
    const streetW2South = Math.abs((ref2A * karenV4Pt.east + ref2B * karenV4Pt.north + ref2C) / ref2Norm);

    // Projections of Conflictiva V1 and V4 onto reference line
    const tc1 = -(ref2A * conflV1.east + ref2B * conflV1.north + ref2C) / (ref2A * ref2A + ref2B * ref2B);
    const projConflV1 = { east: conflV1.east + ref2A * tc1, north: conflV1.north + ref2B * tc1 };

    const tc4 = -(ref2A * conflV4.east + ref2B * conflV4.north + ref2C) / (ref2A * ref2A + ref2B * ref2B);
    const projConflV4 = { east: conflV4.east + ref2A * tc4, north: conflV4.north + ref2B * tc4 };

    // Convert to LatLng
    const valerioV4LL = utmToLatLng(valerioV4.east, valerioV4.north, 18, true);
    const moisesV4LL = utmToLatLng(moisesV4.east, moisesV4.north, 18, true);
    const conflV1LL = utmToLatLng(conflV1.east, conflV1.north, 18, true);
    const conflV4LL = utmToLatLng(conflV4.east, conflV4.north, 18, true);
    const projConflV1LL = utmToLatLng(projConflV1.east, projConflV1.north, 18, true);
    const projConflV4LL = utmToLatLng(projConflV4.east, projConflV4.north, 18, true);
    const jesusV3LL = utmToLatLng(jesusV3.east, jesusV3.north, 18, true);
    const karenV4LL = utmToLatLng(karenV4Pt.east, karenV4Pt.north, 18, true);

    // Direction vector of transversal street (Moises V4 -> Valerio SC V4, south to north)
    const line2Dx = valerioV4.east - moisesV4.east;
    const line2Dy = valerioV4.north - moisesV4.north;
    const line2Len = Math.sqrt(line2Dx * line2Dx + line2Dy * line2Dy);
    const line2Ux = line2Dx / line2Len;
    const line2Uy = line2Dy / line2Len;

    // Orange line 1: Moises V4 -> Valerio SC V4 extended north to height of Opuesta Alcides V2
    const opAlcidesV2 = { east: 215631.9946, north: 9367317.2673 };
    // Project opAlcidesV2 onto the Moises-Valerio line to find how far to extend
    const tOpAlc = ((opAlcidesV2.east - moisesV4.east) * line2Ux + (opAlcidesV2.north - moisesV4.north) * line2Uy);
    const ext2LA = { east: moisesV4.east - line2Ux * 20, north: moisesV4.north - line2Uy * 20 }; // 20m past Moises south
    const ext2LB = { east: moisesV4.east + line2Ux * tOpAlc, north: moisesV4.north + line2Uy * tOpAlc }; // to Opuesta Alcides height
    const ext2LALL = utmToLatLng(ext2LA.east, ext2LA.north, 18, true);
    const ext2LBLL = utmToLatLng(ext2LB.east, ext2LB.north, 18, true);

    L.polyline(
      [[ext2LALL.lat, ext2LALL.lng], [ext2LBLL.lat, ext2LBLL.lng]],
      { color: '#FF9800', weight: 3, dashArray: '10, 6', opacity: 0.9 }
    ).addTo(map).bindPopup('<b>Alineacion calle transversal - Este</b><br>Moises V4 → Valerio SC V4 (proyectada hasta Op. Alcides V2)<br>(lado oeste Mz32)');

    // Orange line 2: Sra. Yola (Karen) V4 -> Jesus V3 extended north to height of Op. Abilio Arce V1
    const opAbilioV1 = { east: 215605.0226, north: 9367332.3556 };
    // Direction is same: Karen->Jesus runs parallel to Moises->Valerio
    const tOpAbilio = ((opAbilioV1.east - karenV4Pt.east) * line2Ux + (opAbilioV1.north - karenV4Pt.north) * line2Uy);
    const ext2RA = { east: karenV4Pt.east - line2Ux * 20, north: karenV4Pt.north - line2Uy * 20 }; // 20m past Karen south
    const ext2RB = { east: karenV4Pt.east + line2Ux * tOpAbilio, north: karenV4Pt.north + line2Uy * tOpAbilio }; // to Op Abilio height
    const ext2RALL = utmToLatLng(ext2RA.east, ext2RA.north, 18, true);
    const ext2RBLL = utmToLatLng(ext2RB.east, ext2RB.north, 18, true);

    L.polyline(
      [[ext2RALL.lat, ext2RALL.lng], [ext2RBLL.lat, ext2RBLL.lng]],
      { color: '#FF9800', weight: 3, dashArray: '10, 6', opacity: 0.9 }
    ).addTo(map).bindPopup('<b>Alineacion calle transversal - Oeste</b><br>Sra. Yola (Karen) V4 → Jesus V3 (proyectada hasta Op. Abilio V1)<br>(lado este Mz30)');

    // Green line: street width between the two yellow lines
    L.polyline(
      [[valerioV4LL.lat, valerioV4LL.lng], [jesusV3LL.lat, jesusV3LL.lng]],
      { color: '#4CAF50', weight: 3, opacity: 0.9 }
    ).addTo(map);

    const streetMid2 = {
      lat: (valerioV4LL.lat + jesusV3LL.lat) / 2,
      lng: (valerioV4LL.lng + jesusV3LL.lng) / 2
    };
    L.marker([streetMid2.lat, streetMid2.lng], {
      icon: L.divIcon({
        className: 'measurement-label',
        html: `Calle: ${((streetW2North + streetW2South) / 2).toFixed(1)} m`,
        iconSize: [120, 20],
        iconAnchor: [60, -5]
      })
    }).addTo(map);

    // Red perpendicular lines from Conflictiva V1 and V4 to projection on Valerio-Moises line
    L.polyline(
      [[conflV1LL.lat, conflV1LL.lng], [projConflV1LL.lat, projConflV1LL.lng]],
      { color: '#F44336', weight: 3, opacity: 0.9 }
    ).addTo(map);

    const midConflV1 = { lat: (conflV1LL.lat + projConflV1LL.lat) / 2, lng: (conflV1LL.lng + projConflV1LL.lng) / 2 };
    L.marker([midConflV1.lat, midConflV1.lng], {
      icon: L.divIcon({
        className: 'measurement-label',
        html: `${Math.abs(distConflV1).toFixed(2)} m`,
        iconSize: [70, 20],
        iconAnchor: [35, 10]
      })
    }).addTo(map);

    L.polyline(
      [[conflV4LL.lat, conflV4LL.lng], [projConflV4LL.lat, projConflV4LL.lng]],
      { color: '#F44336', weight: 3, opacity: 0.9 }
    ).addTo(map);

    const midConflV4 = { lat: (conflV4LL.lat + projConflV4LL.lat) / 2, lng: (conflV4LL.lng + projConflV4LL.lng) / 2 };
    L.marker([midConflV4.lat, midConflV4.lng], {
      icon: L.divIcon({
        className: 'measurement-label',
        html: `${Math.abs(distConflV4).toFixed(2)} m`,
        iconSize: [70, 20],
        iconAnchor: [35, 10]
      })
    }).addTo(map);

    // Green projection dots
    [projConflV1LL, projConflV4LL].forEach((p, i) => {
      L.circleMarker([p.lat, p.lng], {
        radius: 5, color: '#4CAF50', fillColor: '#4CAF50', fillOpacity: 1, weight: 0
      }).addTo(map).bindPopup(`Punto ideal V${i === 0 ? 1 : 4} de Esquina SW sobre linea Valerio-Moises`);
    });

    // Add alignment analysis to panel
    const alignDiv = document.createElement('div');
    alignDiv.className = 'legend';
    alignDiv.innerHTML = `
      <h4>Analisis de Alineacion</h4>
      <p style="font-size:12px; color:#333; margin-bottom:4px;">
        <b>Linea ref:</b> Pablo V4 → Alcides V4 (este)
      </p>
      <p style="font-size:12px; color:#F44336; margin-bottom:4px;">
        <b>Onorato Becerra V1:</b> ${Math.abs(distOnoV1).toFixed(2)} m de desviacion
      </p>
      <p style="font-size:12px; color:#F44336; margin-bottom:4px;">
        <b>Onorato Becerra V2:</b> ${Math.abs(distOnoV2).toFixed(2)} m de desviacion
      </p>
      <p style="font-size:12px; color:#4CAF50; margin-bottom:4px;">
        <b>Jr. Moyobamba:</b> ${((streetWidthSouth + streetWidthNorth) / 2).toFixed(1)} m de ancho
      </p>
      <p style="font-size:11px; color:#666;">
        Ancho sur (Pablo V4 - Brijido Ramirez V1): ${streetWidthSouth.toFixed(2)}m<br>
        Ancho norte (hacia Brijido Ramirez V2): ${streetWidthNorth.toFixed(2)}m<br>
        El terreno de Onorato Becerra esta desplazado ${Math.abs(distOnoV1).toFixed(2)}m (V1) a ${Math.abs(distOnoV2).toFixed(2)}m (V2) respecto a la linea de Pablo/Alcides.
      </p>
      <hr style="margin: 8px 0; border-color: #FF9800;">
      <h4 style="color:#FF9800;">Calle Transversal (Mz30/Mz32 → Mz33)</h4>
      <p style="font-size:12px; color:#333; margin-bottom:4px;">
        <b>Linea ref:</b> Valerio SC V4 → Moises V4 (naranja)
      </p>
      <p style="font-size:12px; color:#F44336; margin-bottom:4px;">
        <b>Esquina SW V1:</b> ${Math.abs(distConflV1).toFixed(2)} m ${distConflV1 > 0 ? '(fuera hacia Mz33)' : '(dentro de Mz32)'}
      </p>
      <p style="font-size:12px; color:#F44336; margin-bottom:4px;">
        <b>Esquina SW V4:</b> ${Math.abs(distConflV4).toFixed(2)} m ${distConflV4 > 0 ? '(fuera hacia Mz33)' : '(cruza la linea de Mz32)'}
      </p>
      <p style="font-size:12px; color:#4CAF50; margin-bottom:4px;">
        <b>Calle transversal:</b> ${((streetW2North + streetW2South) / 2).toFixed(1)} m de ancho
      </p>
      <p style="font-size:11px; color:#666;">
        Ancho norte (Valerio-Jesus): ${streetW2North.toFixed(2)}m<br>
        Ancho sur (Moises-Karen): ${streetW2South.toFixed(2)}m<br>
        Esquina SW V1 esta a ${Math.abs(distConflV1).toFixed(2)}m de la linea Mz32. V4 cruza ${Math.abs(distConflV4).toFixed(2)}m al otro lado.
      </p>
    `;
    document.getElementById('infoPanel').insertBefore(alignDiv, document.querySelector('.info-panel hr'));

    // --- Street name labels (centered between parallel street lines) ---

    // Jr. Moyobamba: center between yellow west line (Pablo V4→Alcides) and yellow east line (Brijido V1→V2)
    // Take midpoints of each line at same height, then average
    const pabloV4Pt = { east: 215678.1653, north: 9367213.6696 };
    const brijV1Pt = { east: 215691.9285, north: 9367210.6303 };
    const alcidesV4Pt = { east: 215697.05, north: 9367262.0383 };
    const brijV2Pt = { east: 215701.9199, north: 9367236.6628 };
    // Center at mid-height between Pablo and Alcides
    const jrMoyoMid = {
      east: (pabloV4Pt.east + brijV1Pt.east + alcidesV4Pt.east + brijV2Pt.east) / 4,
      north: (pabloV4Pt.north + brijV1Pt.north + alcidesV4Pt.north + brijV2Pt.north) / 4
    };
    const jrMoyoLL = utmToLatLng(jrMoyoMid.east, jrMoyoMid.north, 18, true);
    L.marker([jrMoyoLL.lat, jrMoyoLL.lng], {
      icon: L.divIcon({
        className: 'street-label',
        html: 'Jr. Moyobamba',
        iconSize: [130, 20],
        iconAnchor: [65, 10]
      })
    }).addTo(map);

    // Jr. Rioja: center between orange east line (Valerio→Moises) and orange west line (Karen→Jesus)
    // Take points at same height on both lines, then average
    const jrRiojaMid = {
      east: (valerioV4.east + jesusV3.east + moisesV4.east + karenV4Pt.east) / 4,
      north: (valerioV4.north + jesusV3.north + moisesV4.north + karenV4Pt.north) / 4
    };
    const jrRiojaLL = utmToLatLng(jrRiojaMid.east, jrRiojaMid.north, 18, true);
    L.marker([jrRiojaLL.lat, jrRiojaLL.lng], {
      icon: L.divIcon({
        className: 'street-label',
        html: 'Jr. Rioja',
        iconSize: [100, 20],
        iconAnchor: [50, 10]
      })
    }).addTo(map);

    // Av. Marginal - Fernando Belaunde Terry: E-W along south edge of Mz32
    // South side of Mz32 perimeter runs between Moises V4 and the SE projected corner
    // Center below the south side of the Mz32 perimeter
    const mz32SEdge1 = { east: 215543.6415, north: 9367130.8227 }; // Moises V4 (SW corner Mz32)
    const mz32SEdge2 = { east: 215632.2513, north: 9367096.0716 }; // SE corner Mz32
    const avMarginalMid = {
      east: (mz32SEdge1.east + mz32SEdge2.east) / 2,
      north: (mz32SEdge1.north + mz32SEdge2.north) / 2 - 12
    };
    const avMarginalLL = utmToLatLng(avMarginalMid.east, avMarginalMid.north, 18, true);
    L.marker([avMarginalLL.lat, avMarginalLL.lng], {
      icon: L.divIcon({
        className: 'street-label street-label-av',
        html: 'Av. Marginal - Fernando Belaunde Terry',
        iconSize: [300, 20],
        iconAnchor: [150, 10]
      })
    }).addTo(map);

    // --- Measurement tool ---
    let measuring = false;
    let measurePoints = [];
    let measureMarkers = [];
    let measureLines = [];
    let measureLabels = [];

    function toggleMeasure() {
      measuring = !measuring;
      const btn = document.getElementById('measureBtn');
      btn.classList.toggle('active', measuring);
      btn.textContent = measuring ? 'Midiendo... (click 2 puntos)' : 'Medir distancia';
      if (measuring) {
        measurePoints = [];
        map.getContainer().style.cursor = 'crosshair';
      } else {
        map.getContainer().style.cursor = '';
      }
    }

    function clearMeasurements() {
      measureMarkers.forEach(m => map.removeLayer(m));
      measureLines.forEach(l => map.removeLayer(l));
      measureLabels.forEach(l => map.removeLayer(l));
      measureMarkers = [];
      measureLines = [];
      measureLabels = [];
      measurePoints = [];
    }

    function haversineDistance(lat1, lng1, lat2, lng2) {
      const R = 6371000;
      const dLat = (lat2 - lat1) * Math.PI / 180;
      const dLng = (lng2 - lng1) * Math.PI / 180;
      const a = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
        Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
        Math.sin(dLng / 2) * Math.sin(dLng / 2);
      return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
    }

    map.on('click', function (e) {
      if (!measuring) return;

      measurePoints.push(e.latlng);

      const marker = L.circleMarker(e.latlng, {
        radius: 5,
        color: '#FF5722',
        fillColor: '#FF5722',
        fillOpacity: 1
      }).addTo(map);
      measureMarkers.push(marker);

      if (measurePoints.length === 2) {
        const [p1, p2] = measurePoints;
        const dist = haversineDistance(p1.lat, p1.lng, p2.lat, p2.lng);

        const line = L.polyline([p1, p2], {
          color: '#FF5722',
          weight: 3,
          dashArray: '8, 4'
        }).addTo(map);
        measureLines.push(line);

        const midLat = (p1.lat + p2.lat) / 2;
        const midLng = (p1.lng + p2.lng) / 2;
        const label = L.marker([midLat, midLng], {
          icon: L.divIcon({
            className: 'measurement-label',
            html: `${dist.toFixed(1)} m`,
            iconSize: [80, 20],
            iconAnchor: [40, 10]
          })
        }).addTo(map);
        measureLabels.push(label);

        measurePoints = [];
      }
    });
  </script>
</body>
</html>
