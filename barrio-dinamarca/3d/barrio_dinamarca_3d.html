<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Barrio Dinamarca 3D — Aguas Claras, Moyobamba</title>
<style>
  /* ===== RESET & BASE ===== */
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

  @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap');

  :root {
    --bg: #0a0f1a;
    --panel-bg: rgba(12, 18, 35, 0.92);
    --panel-border: rgba(255, 255, 255, 0.06);
    --text: #e8eaf0;
    --text-dim: #7a8194;
    --accent: #38bdf8;
    --accent-dim: rgba(56, 189, 248, 0.15);
    --green: #34d399;
    --orange: #fb923c;
    --red: #f87171;
    --radius: 10px;
    --font: 'DM Sans', system-ui, sans-serif;
    --mono: 'JetBrains Mono', monospace;
  }

  body {
    font-family: var(--font);
    background: var(--bg);
    color: var(--text);
    overflow: hidden;
    width: 100vw;
    height: 100vh;
  }

  canvas { display: block; }

  /* ===== 3D LABELS ===== */
  .label-3d {
    font-family: var(--font);
    font-size: 10px;
    font-weight: 600;
    color: #fff;
    background: rgba(0,0,0,0.55);
    padding: 2px 6px;
    border-radius: 4px;
    pointer-events: none;
    white-space: nowrap;
    text-shadow: 0 1px 2px rgba(0,0,0,0.5);
    backdrop-filter: blur(4px);
    border: 1px solid rgba(255,255,255,0.08);
    transform: translate(-50%, -100%);
    transition: opacity 0.2s;
  }

  /* ===== TOP BAR ===== */
  .topbar {
    position: fixed;
    top: 16px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 100;
    display: flex;
    align-items: center;
    gap: 12px;
    background: var(--panel-bg);
    border: 1px solid var(--panel-border);
    border-radius: 40px;
    padding: 8px 20px;
    backdrop-filter: blur(20px);
    box-shadow: 0 8px 32px rgba(0,0,0,0.4);
  }

  .topbar .dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: var(--green);
    box-shadow: 0 0 8px var(--green);
    animation: pulse-dot 2s infinite;
  }

  @keyframes pulse-dot {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.4; }
  }

  .topbar h1 {
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 0.02em;
  }

  .topbar span {
    font-size: 11px;
    color: var(--text-dim);
    font-weight: 400;
  }

  /* ===== SIDE PANEL ===== */
  .panel {
    position: fixed;
    top: 70px;
    right: 16px;
    width: 300px;
    max-height: calc(100vh - 90px);
    overflow-y: auto;
    z-index: 100;
    background: var(--panel-bg);
    border: 1px solid var(--panel-border);
    border-radius: var(--radius);
    backdrop-filter: blur(20px);
    box-shadow: 0 8px 32px rgba(0,0,0,0.4);
    display: flex;
    flex-direction: column;
  }

  .panel::-webkit-scrollbar { width: 4px; }
  .panel::-webkit-scrollbar-track { background: transparent; }
  .panel::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 4px; }

  .panel-section {
    padding: 14px 16px;
    border-bottom: 1px solid var(--panel-border);
  }

  .panel-section:last-child { border-bottom: none; }

  .section-label {
    font-size: 9px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: var(--text-dim);
    margin-bottom: 8px;
  }

  /* ===== SOLAR INFO ===== */
  .solar-name {
    font-size: 16px;
    font-weight: 700;
    margin-bottom: 2px;
    line-height: 1.2;
  }

  .solar-mz {
    font-size: 11px;
    color: var(--accent);
    font-weight: 500;
    margin-bottom: 10px;
  }

  .info-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 6px;
  }

  .info-card {
    background: rgba(255,255,255,0.04);
    border-radius: 6px;
    padding: 8px 10px;
  }

  .info-card .val {
    font-family: var(--mono);
    font-size: 14px;
    font-weight: 500;
    color: #fff;
  }

  .info-card .lbl {
    font-size: 9px;
    color: var(--text-dim);
    margin-top: 1px;
  }

  .sides-list {
    display: flex;
    flex-wrap: wrap;
    gap: 4px;
    margin-top: 6px;
  }

  .side-tag {
    font-family: var(--mono);
    font-size: 10px;
    background: rgba(255,255,255,0.06);
    border-radius: 4px;
    padding: 3px 7px;
    color: var(--text-dim);
  }

  /* ===== CONTROLS ===== */
  .control-row {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 8px;
  }

  .control-row:last-child { margin-bottom: 0; }

  .control-row label {
    font-size: 11px;
    font-weight: 500;
    color: var(--text-dim);
    min-width: 50px;
  }

  input[type="color"] {
    -webkit-appearance: none;
    width: 32px;
    height: 32px;
    border: 2px solid rgba(255,255,255,0.1);
    border-radius: 6px;
    cursor: pointer;
    background: transparent;
    padding: 0;
  }

  input[type="color"]::-webkit-color-swatch-wrapper { padding: 2px; }
  input[type="color"]::-webkit-color-swatch { border-radius: 3px; border: none; }

  input[type="range"] {
    -webkit-appearance: none;
    flex: 1;
    height: 4px;
    background: rgba(255,255,255,0.1);
    border-radius: 2px;
    outline: none;
  }

  input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 14px;
    height: 14px;
    border-radius: 50%;
    background: var(--accent);
    cursor: pointer;
    box-shadow: 0 0 8px rgba(56,189,248,0.4);
  }

  .height-val {
    font-family: var(--mono);
    font-size: 12px;
    color: var(--accent);
    min-width: 30px;
    text-align: right;
  }

  /* ===== BUTTONS ===== */
  .btn {
    width: 100%;
    padding: 8px;
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 6px;
    background: rgba(255,255,255,0.04);
    color: var(--text);
    font-family: var(--font);
    font-size: 11px;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.15s;
  }

  .btn:hover {
    background: rgba(255,255,255,0.08);
    border-color: rgba(255,255,255,0.15);
  }

  /* ===== LEGEND ===== */
  .legend-list {
    display: flex;
    flex-direction: column;
    gap: 2px;
  }

  .legend-item {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 5px 8px;
    border-radius: 5px;
    cursor: pointer;
    transition: background 0.15s;
    font-size: 11px;
  }

  .legend-item:hover { background: rgba(255,255,255,0.06); }

  .legend-item.active {
    background: var(--accent-dim);
  }

  .legend-dot {
    width: 10px;
    height: 10px;
    border-radius: 3px;
    flex-shrink: 0;
  }

  .legend-name {
    flex: 1;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .legend-mz {
    font-size: 9px;
    color: var(--text-dim);
    font-family: var(--mono);
  }

  /* ===== EMPTY STATE ===== */
  .empty-state {
    text-align: center;
    padding: 20px 10px;
    color: var(--text-dim);
  }

  .empty-state .icon {
    font-size: 28px;
    margin-bottom: 8px;
    opacity: 0.5;
  }

  .empty-state p {
    font-size: 12px;
    line-height: 1.5;
  }

  /* ===== KEYBOARD HINTS ===== */
  .hints {
    position: fixed;
    bottom: 16px;
    left: 16px;
    z-index: 100;
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
  }

  .hint {
    display: flex;
    align-items: center;
    gap: 5px;
    font-size: 10px;
    color: var(--text-dim);
    background: var(--panel-bg);
    border: 1px solid var(--panel-border);
    border-radius: 6px;
    padding: 4px 8px;
    backdrop-filter: blur(10px);
  }

  .hint kbd {
    font-family: var(--mono);
    font-size: 9px;
    background: rgba(255,255,255,0.08);
    border-radius: 3px;
    padding: 1px 4px;
    font-weight: 500;
  }

  /* ===== COMPASS ===== */
  .compass {
    position: fixed;
    bottom: 16px;
    right: 16px;
    z-index: 100;
    width: 56px;
    height: 56px;
  }

  .compass svg {
    width: 100%;
    height: 100%;
    filter: drop-shadow(0 2px 8px rgba(0,0,0,0.5));
  }

  /* ===== RESPONSIVE ===== */
  @media (max-width: 640px) {
    .panel { width: 260px; right: 8px; top: 62px; }
    .topbar { padding: 6px 14px; }
    .topbar h1 { font-size: 11px; }
  }
</style>
</head>

<!-- ===== TOP BAR ===== -->
<div class="topbar">
  <div class="dot"></div>
  <h1>Barrio Dinamarca</h1>
  <span>Aguas Claras · Moyobamba · San Martín</span>
</div>

<!-- ===== SIDE PANEL ===== -->
<div class="panel" id="panel">
  <!-- SOLAR INFO (shown when selected) -->
  <div id="solarInfo" style="display:none;">
    <div class="panel-section">
      <div class="section-label">Solar seleccionado</div>
      <div class="solar-name" id="infoName">—</div>
      <div class="solar-mz" id="infoMz">—</div>
      <div class="info-grid">
        <div class="info-card">
          <div class="val" id="infoArea">—</div>
          <div class="lbl">Área (m²)</div>
        </div>
        <div class="info-card">
          <div class="val" id="infoPerim">—</div>
          <div class="lbl">Perímetro (m)</div>
        </div>
      </div>
      <div class="section-label" style="margin-top:10px;">Medidas de lados</div>
      <div class="sides-list" id="infoSides"></div>
    </div>

    <div class="panel-section">
      <div class="section-label">Controles</div>
      <div class="control-row">
        <label>Color</label>
        <input type="color" id="colorPicker" value="#4CAF50">
      </div>
      <div class="control-row">
        <label>Altura</label>
        <input type="range" id="heightSlider" min="1" max="15" value="4" step="0.5">
        <span class="height-val" id="heightVal">4m</span>
      </div>
      <div style="margin-top:8px;">
        <button class="btn" id="btnDeselect">✕ Deseleccionar</button>
      </div>
    </div>
  </div>

  <!-- EMPTY STATE -->
  <div id="emptyState" class="panel-section">
    <div class="empty-state">
      <div class="icon">🏘️</div>
      <p>Haz clic en un solar<br>para ver su información</p>
    </div>
  </div>

  <!-- LEGEND -->
  <div class="panel-section">
    <div class="section-label">Solares · <span id="solarCount">0</span> lotes</div>
    <div class="legend-list" id="legendList"></div>
  </div>
</div>

<!-- ===== KEYBOARD HINTS ===== -->
<div class="hints">
  <div class="hint"><kbd>W</kbd><kbd>S</kbd> Zoom</div>
  <div class="hint"><kbd>A</kbd><kbd>D</kbd> Rotar</div>
  <div class="hint">🖱️ Arrastrar para orbitar</div>
</div>

// Collect ALL coordinates to find center
const allCoords = [];
DATA.solares.forEach(s => s.vertices.forEach(v => allCoords.push(v)));
DATA.manzanas.forEach(m => m.corners.forEach(c => allCoords.push(c)));
DATA.perimetro_general.vertices.forEach(v => allCoords.push(v));

const minE = Math.min(...allCoords.map(c => c.east));
const maxE = Math.max(...allCoords.map(c => c.east));
const minN = Math.min(...allCoords.map(c => c.north));
const maxN = Math.max(...allCoords.map(c => c.north));
const centerE = (minE + maxE) / 2;
const centerN = (minN + maxN) / 2;

function toLocal(east, north) {
  return { x: east - centerE, z: -(north - centerN) };
}

// 9) SOLARES (3D extruded lots)
// ============================================================
const solarMeshes = [];       // Array of mesh references
const solarDataMap = new Map(); // mesh -> solar data

function createSolarMesh(solar, index) {
  const pts2D = solar.vertices.map(v => toLocal(v.east, v.north));

  // Compute centroid
  const cx = pts2D.reduce((s, p) => s + p.x, 0) / pts2D.length;
  const cz = pts2D.reduce((s, p) => s + p.z, 0) / pts2D.length;

  // Create Shape (local to centroid for better extrusion)
  const shape = new THREE.Shape();
  shape.moveTo(pts2D[0].x - cx, pts2D[0].z - cz);
  for (let i = 1; i < pts2D.length; i++) {
    shape.lineTo(pts2D[i].x - cx, pts2D[i].z - cz);
  }
  shape.closePath();

  const height = solar.default_height_m || 4;

  const extrudeSettings = {
    depth: height,
    bevelEnabled: true,
    bevelThickness: 0.15,
    bevelSize: 0.1,
    bevelSegments: 1
  };

  const geometry = new THREE.ExtrudeGeometry(shape, extrudeSettings);

  // Rotate so extrusion goes up (Y axis)
  geometry.rotateX(-Math.PI / 2);

  const color = new THREE.Color(solar.color);
  const material = new THREE.MeshStandardMaterial({
    color: color,
    roughness: 0.55,
    metalness: 0.05,
    flatShading: false
  });

  const mesh = new THREE.Mesh(geometry, material);
  mesh.position.set(cx, 0, cz);
  mesh.castShadow = true;
  mesh.receiveShadow = true;

  // Store metadata
  mesh.userData = {
    solarIndex: index,
    name: solar.name,
    manzana: solar.manzana,
    color: solar.color,
    sides: solar.sides_m,
    height: height,
    type: solar.type,
    centroid: { x: cx, z: cz },
    vertices2D: pts2D,
    shapeRef: shape
  };

  scene.add(mesh);
  solarMeshes.push(mesh);
  solarDataMap.set(mesh, solar);

  // 3D Label above solar
  const labelDiv = document.createElement('div');
  labelDiv.className = 'label-3d';
  labelDiv.textContent = solar.name;
  const label = new CSS2DObject(labelDiv);
  label.position.set(0, height + 2, 0);
  mesh.add(label);
  mesh.userData.labelObj = label;

  // Edge outline
  const edgesGeo = new THREE.EdgesGeometry(geometry, 20);
  const edgesMat = new THREE.LineBasicMaterial({ color: 0x000000, opacity: 0.15, transparent: true });
  const edges = new THREE.LineSegments(edgesGeo, edgesMat);
  mesh.add(edges);
  mesh.userData.edgesRef = edges;

  return mesh;
}

DATA.solares.forEach((solar, i) => createSolarMesh(solar, i));

// ============================================================
// 10) AREA CALCULATION (Shoelace formula)
// ============================================================
function calcArea(vertices) {
  let area = 0;
  const n = vertices.length;
  for (let i = 0; i < n; i++) {
    const j = (i + 1) % n;
    area += vertices[i].east * vertices[j].north;
    area -= vertices[j].east * vertices[i].north;
  }
  return Math.abs(area / 2);
}

function calcPerimeter(sides) {
  return sides.reduce((s, v) => s + v, 0);
}

function selectSolar(mesh) {
  // Deselect previous
  if (selectedMesh) {
    selectedMesh.material.emissive.setHex(0x000000);
    selectedMesh.material.emissiveIntensity = 0;
    if (selectedMesh.userData.edgesRef) {
      selectedMesh.userData.edgesRef.material.color.setHex(0x000000);
      selectedMesh.userData.edgesRef.material.opacity = 0.15;
    }
  }

  selectedMesh = mesh;

  if (!mesh) {
    solarInfoEl.style.display = 'none';
    emptyStateEl.style.display = 'block';
    document.querySelectorAll('.legend-item').forEach(el => el.classList.remove('active'));
    return;
  }

  // Highlight
  mesh.material.emissive.setHex(0xffffff);
  mesh.material.emissiveIntensity = 0.15;
  if (mesh.userData.edgesRef) {
    mesh.userData.edgesRef.material.color.set(0x38bdf8);
    mesh.userData.edgesRef.material.opacity = 0.8;
  }

  const solar = solarDataMap.get(mesh);
  const ud = mesh.userData;

  // Update UI
  solarInfoEl.style.display = 'block';
  emptyStateEl.style.display = 'none';

  infoNameEl.textContent = ud.name;
  infoMzEl.textContent = ud.manzana + (ud.type === 'communal' ? ' · Comunal' : ' · Residencial');

  const area = calcArea(solar.vertices);
  infoAreaEl.textContent = area.toFixed(1);
  infoPerimEl.textContent = calcPerimeter(ud.sides).toFixed(1);

  infoSidesEl.innerHTML = '';
  ud.sides.forEach((s, i) => {
    const tag = document.createElement('span');
    tag.className = 'side-tag';
    tag.textContent = `L${i + 1}: ${s.toFixed(2)}m`;
    infoSidesEl.appendChild(tag);
  });

  colorPickerEl.value = ud.color;
  heightSliderEl.value = ud.height;
  heightValEl.textContent = ud.height + 'm';

  // Update legend active
  document.querySelectorAll('.legend-item').forEach((el, i) => {
    el.classList.toggle('active', i === ud.solarIndex);
  });
}

// Click handler
renderer.domElement.addEventListener('click', (e) => {
  const rect = renderer.domElement.getBoundingClientRect();
  mouse.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
  mouse.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;

  raycaster.setFromCamera(mouse, camera);
  const hits = raycaster.intersectObjects(solarMeshes);

  if (hits.length > 0) {
    selectSolar(hits[0].object);
  } else {
    selectSolar(null);
  }
});

heightSliderEl.addEventListener('input', (e) => {
  if (!selectedMesh) return;

  const newHeight = parseFloat(e.target.value);
  heightValEl.textContent = newHeight + 'm';

  const mesh = selectedMesh;
  const solar = solarDataMap.get(mesh);
  const ud = mesh.userData;

  // Recreate geometry with new height
  const extrudeSettings = {
    depth: newHeight,
    bevelEnabled: true,
    bevelThickness: 0.15,
    bevelSize: 0.1,
    bevelSegments: 1
  };

  const newGeo = new THREE.ExtrudeGeometry(ud.shapeRef, extrudeSettings);
  newGeo.rotateX(-Math.PI / 2);

  mesh.geometry.dispose();
  mesh.geometry = newGeo;

  // Rebuild edges
  if (ud.edgesRef) {
    mesh.remove(ud.edgesRef);
    ud.edgesRef.geometry.dispose();
  }
  const edgesGeo = new THREE.EdgesGeometry(newGeo, 20);
  const isSelected = (mesh === selectedMesh);
  const edgesMat = new THREE.LineBasicMaterial({
    color: isSelected ? 0x38bdf8 : 0x000000,
    opacity: isSelected ? 0.8 : 0.15,
    transparent: true
  });
  const edges = new THREE.LineSegments(edgesGeo, edgesMat);
  mesh.add(edges);
  ud.edgesRef = edges;

  // Move label
  if (ud.labelObj) {
    ud.labelObj.position.set(0, newHeight + 2, 0);
  }

  ud.height = newHeight;
});

const keys = {};
window.addEventListener('keydown', e => keys[e.key.toLowerCase()] = true);
window.addEventListener('keyup', e => keys[e.key.toLowerCase()] = false);

function handleKeys() {
  const speed = 1.5;
  if (keys['w']) {
    camera.position.lerp(controls.target, 0.02);
  }
  if (keys['s']) {
    const dir = camera.position.clone().sub(controls.target).normalize();
    camera.position.add(dir.multiplyScalar(speed));
  }
  if (keys['a']) {
    const angle = 0.015;
    const pos = camera.position.clone().sub(controls.target);
    const cos = Math.cos(angle), sin = Math.sin(angle);
    const nx = pos.x * cos - pos.z * sin;
    const nz = pos.x * sin + pos.z * cos;
    camera.position.set(nx + controls.target.x, camera.position.y, nz + controls.target.z);
  }
  if (keys['d']) {
    const angle = -0.015;
    const pos = camera.position.clone().sub(controls.target);
    const cos = Math.cos(angle), sin = Math.sin(angle);
    const nx = pos.x * cos - pos.z * sin;
    const nz = pos.x * sin + pos.z * cos;
    camera.position.set(nx + controls.target.x, camera.position.y, nz + controls.target.z);
  }
}

// ============================================================
// 17) RESIZE HANDLER
// ============================================================
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
  labelRenderer.setSize(window.innerWidth, window.innerHeight);
});

// ============================================================
// 18) ANIMATION LOOP
// ============================================================
function animate() {
  requestAnimationFrame(animate);
  handleKeys();
  controls.update();
  renderer.render(scene, camera);
  labelRenderer.render(scene, camera);
}

animate();

// ============================================================
// 19) INITIAL CAMERA POSITION
// ============================================================
camera.position.set(50, 200, 220);
controls.target.set(30, 0, -20);
controls.update();

console.log('✅ Barrio Dinamarca 3D loaded —', DATA.solares.length, 'solares');
</script>
